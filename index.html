<script>
  let device;
  const serviceUuid = '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'.toLowerCase(); // Reemplaza con el UUID del servicio en tu ESP32
  const characteristicUuid = '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'.toLowerCase(); // Reemplaza con el UUID de la característica en tu ESP32

  function onDisconnected() {
    console.log('Desconectado del dispositivo Bluetooth.');
    document.getElementById('estado').innerHTML = '<span class="bg-red-100 text-red-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded dark:bg-red-900 dark:text-red-300">DESCONECTADO</span>';
    document.getElementById('conectar').disabled = false;
    document.getElementById('desconectar').disabled = true;

    document.querySelectorAll('.botones').forEach((button) => {
      button.disabled = true;
    });
  }

  async function connect() {
    try {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'ESP32' }],
        optionalServices: [serviceUuid]
      });
      console.log('Conectado a: ' + device.name);
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(serviceUuid);
      const characteristic = await service.getCharacteristic(characteristicUuid);
      device.addEventListener('gattserverdisconnected', onDisconnected);
      document.getElementById('estado').innerHTML = '<span class="bg-green-100 text-green-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded dark:bg-green-900 dark:text-green-300">CONECTADO</span>';
      document.getElementById('conectar').disabled = true;
      document.getElementById('desconectar').disabled = false;

      document.querySelectorAll('.botones').forEach((button) => {
        button.disabled = false;
      });
    } catch (error) {
      alert('Error de conexión Bluetooth: ' + error);
    }
  }

  function disconnect() {
    try {
      if (device && device.gatt.connected) {
        device.gatt.disconnect();
        console.log('Desconectado del dispositivo Bluetooth.');
      }

      onDisconnected();
    } catch (error) {
      alert('Error al desconectar: ', error);
    }
  }

  async function sendTextMessage(message) {
    try {
      // Verifica si el dispositivo está conectado
      if (!device || !device.gatt.connected) {
        alert('No se ha establecido una conexión Bluetooth.');
        return;
      }

      const service = await device.gatt.getPrimaryService(serviceUuid);
      const characteristic = await service.getCharacteristic(characteristicUuid);

      // Convierte el mensaje en un ArrayBuffer (datos binarios)
      const encoder = new TextEncoder();
      const data = encoder.encode(message);

      // Escribe los datos en la característica
      await characteristic.writeValue(data);

      console.log('Mensaje enviado con éxito:', message);
    } catch (error) {
      alert('Error al enviar el mensaje:', error);
    }
  }

</script>
